name: Build book

# Genera los PDF y EPUB en cada cambio del libro. Al publicar una etiqueta vX.Y
# crea además una release con los ficheros listos para descargar.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  PANDOC_VERSION: "3.11"
  TYPST_VERSION: "0.15.1"
  EPUBCHECK_VERSION: "5.4.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq fonts-dejavu-core
          curl -sfL -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          curl -sfL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar xJ -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/
          curl -sfL -o /tmp/epubcheck.zip \
            "https://github.com/w3c/epubcheck/releases/download/v${EPUBCHECK_VERSION}/epubcheck-${EPUBCHECK_VERSION}.zip"
          unzip -q /tmp/epubcheck.zip -d /tmp
          pandoc --version | head -1
          typst --version

      - name: Build
        run: ./build.sh

      - name: Validate EPUB
        run: |
          for f in build/*.epub; do
            java -jar "/tmp/epubcheck-${EPUBCHECK_VERSION}/epubcheck.jar" "$f"
          done

      - name: Collect files
        run: |
          mkdir dist
          for lang in es en; do
            cp "build/$lang.pdf"  "dist/springboot-questions-$lang.pdf"
            cp "build/$lang.epub" "dist/springboot-questions-$lang.epub"
            cp "build/$lang-cover.png" "dist/springboot-questions-$lang-cover.png"
          done
          ls -l dist

      - uses: actions/upload-artifact@v7
        with:
          name: book
          path: dist/

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
